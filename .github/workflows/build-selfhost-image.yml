name: Build self-host image

# Builds the self-hosted github-readme-activity-graph container that serves
# stats.wielandtech.com/graph and pushes it to GHCR. Flux image-automation in
# the homelab repo tracks the date-time-sha tag and bumps the HelmRelease.
#
# Runs on the shared homelab dind ARC runner pool (label homelab-dind),
# registered at the org level (wielandtech-labs) in w_homelab
# clusters/prod/infrastructure/github-runners/.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs never run on the self-hosted runners: they sit inside the cluster.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-dind
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (remote buildkitd)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
          driver-opts: |
            cacert=/etc/buildkit/certs/ca.crt
            cert=/etc/buildkit/certs/tls.crt
            key=/etc/buildkit/certs/tls.key

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version vars
        id: vars
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "time=$(date +'%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wielandtech-labs/github-readme-activity-graph
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.time }}-${{ steps.vars.outputs.sha }},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=inline
